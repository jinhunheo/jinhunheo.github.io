# Publishes the site to GitHub Pages (free) on every push to main.
#
# The repository must be named <github-username>.github.io, so the site is served
# from the root of https://<github-username>.github.io (the site's links are
# absolute). In the repository's Settings → Pages, "Source" must be GitHub Actions.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer push waits instead of cancelling a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v6

      - name: Check the site address matches this repository
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          site=$(node --input-type=module -e "const { loadContent, siteUrl } = await import('./src/site/content.ts'); console.log(siteUrl(loadContent('.'), 'production'))")
          if [ "$site" != "${PAGES_URL%/}" ]; then
            echo "::error::content/site.yaml urls.production is $site, but this repository publishes to $PAGES_URL. Name the repository <github-username>.github.io and set urls.production to match."
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build:pages

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
